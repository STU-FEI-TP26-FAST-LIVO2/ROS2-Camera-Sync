# /etc/sysctl.d/60-ros2-buffers.conf
#
# Stereolabs DDS tuning pre ROS 2 s velkymi spravami (PointCloud2, obrazy).
# Inštalácia: sudo cp 60-ros2-buffers.conf /etc/sysctl.d/ && sudo sysctl --system
#
# Tieto hodnoty sa aplikuju pri kazdom boote automaticky.

# Maximalna velkost OS UDP receive buffra (2 GB).
# Cyclone DDS pouzije tuto hodnotu na vytvorenie socketu ak je dostatocna.
net.core.rmem_max = 2147483647

# Cas, po ktorom sa zahodi nedokompletizovany IP fragment (sekundy).
# Znizenie z 30 na 3 redukuje „ghost" data z predchadzajucich fragmentovanych sprav.
net.ipv4.ipfrag_time = 3

# Maximalna pamat pre skladanie IP fragmentov (128 MB).
# Potlaca "ip: Fragment cache is full" varovania pri hustom point cloud toku.
net.ipv4.ipfrag_high_thresh = 134217728
